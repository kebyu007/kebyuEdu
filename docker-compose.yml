version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: erp-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Database connection string pointing to the db service
      DATABASE_URL: "postgresql://user:password@db:5432/mydb?schema=public"
      # Redis connection settings (if applicable in your app)
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    volumes:
      # Mount local uploads folder to persist uploaded files
      - uploads:/app/uploads

volumes:
  postgresdata:
  redisdata:
  uploads:
